name: "Chromatic Visual Tests"

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  chromatic:
    name: "Run Chromatic & Visual Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check Chromatic Token
        id: check_token
        run: |
          if [ -z "${{ secrets.CHROMATIC_PROJECT_TOKEN }}" ]; then
            echo "token_present=false" >> $GITHUB_OUTPUT
            echo "::notice::CHROMATIC_PROJECT_TOKEN is not set. Visual regression tests skipped."
          else
            echo "token_present=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish Storybook to Chromatic & Run Visual Tests
        if: steps.check_token.outputs.token_present == 'true'
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: src/frontend
          buildScriptName: build-storybook
          exitZeroOnChanges: true
          autoAcceptChanges: false
