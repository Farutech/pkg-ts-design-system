name: Publish @farutech/design-system to GitHub Packages

# Dispara automáticamente al hacer push de un tag v* (ej: v1.1.0, v1.2.0)
# También permite ejecución manual desde la UI de GitHub Actions.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no publica, solo verifica build + tests)'
        required: false
        default: false
        type: boolean

jobs:
  quality-gate:
    name: Quality Gate (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test -- --run

      - name: Build
        run: npm run build

  publish:
    name: Publish to GitHub Packages
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20 con GitHub Packages registry
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@farutech'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (producción)
        run: npm run build

      - name: Publish to GitHub Packages
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          npm publish --access public 2>&1 | tee publish.log
          EXIT_CODE=${PIPESTATUS[0]}
          if grep -q "409 Conflict" publish.log || grep -q "Cannot publish over existing version" publish.log; then
            echo "::notice::Version already published — skipping (idempotent). OK."
            exit 0
          fi
          exit $EXIT_CODE
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}


      - name: Dry run info
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "Dry run completado. Build y tests pasaron. No se publicó."
